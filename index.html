<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bandar Teknologi Hijau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the 3D city fills the whole screen. Everything else floats above it in small glass panels:
   top bar (brand + tools), left column (sector list on top, status dock at bottom), and a right drawer
   that only opens when a sector is chosen. On phones the list becomes a chip strip and the drawer a bottom sheet. */
:root{
  --ink:#14202b;
  --muted:#5d6b78;
  --line:rgba(20,32,43,.10);
  --tint:rgba(20,32,43,.06);
  --glass:rgba(255,255,255,.84);
  --glass-strong:rgba(255,255,255,.96);
  --accent:#1f7a5a;
  --accent-soft:#e2f1ea;
  --blue:#2563eb;
  --amber:#d97706;
  --good:#1f7a5a;
  --bad:#c92a2a;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,30,45,.14),0 1px 2px rgba(15,30,45,.08);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:16px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:#cfdbe5;overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#view{position:fixed;inset:0;background:#cfdbe5}
#view canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}

.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:var(--radius)}
.ui{position:fixed;z-index:5}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.topbar{top:max(var(--gut),env(safe-area-inset-top));left:max(var(--gut),env(safe-area-inset-left));right:max(var(--gut),env(safe-area-inset-right));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;padding:9px 18px 9px 9px;min-width:0}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.brand .mark svg{width:20px;height:20px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:4px;padding:6px}
.seg{display:flex;background:var(--tint);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ibtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink)}
.ibtn:hover{background:var(--tint)}
.ibtn.primary{background:var(--ink);color:#fff}
.ibtn.primary:hover{background:#2a3d50}
.ibtn.on{background:var(--accent-soft);color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}

/* left column: sector list + status dock */
.leftcol{top:96px;bottom:max(var(--gut),env(safe-area-inset-bottom));left:max(var(--gut),env(safe-area-inset-left));width:min(420px,calc(100% - 32px));
  display:flex;flex-direction:column;justify-content:space-between;gap:16px;pointer-events:none}
.leftcol>*{pointer-events:auto}
.sectors{width:252px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sectors .head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 10px 10px 16px}
.sectors h2{margin:3px 0 0;font-size:15px;font-weight:700}
.icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--tint);color:var(--ink)}
.icon svg{transition:transform .25s}
.sectors.min .list{display:none}
.sectors.min .icon svg{transform:rotate(180deg)}
.list{overflow:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;text-align:left;width:100%;font-weight:500;font-size:13.5px}
.item .ic{width:30px;height:30px;border-radius:8px;background:var(--tint);display:grid;place-items:center;font-size:15px;flex:none}
.item:hover{background:var(--tint)}
.item.cur{background:var(--ink);color:#fff}
.item.cur .ic{background:rgba(255,255,255,.14)}
.item.all .ic svg{width:16px;height:16px}

.dock{padding:12px;display:flex;flex-direction:column;gap:12px}
.dock .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg.state button.on.g{color:var(--good)}
.seg.state button.on.r{color:var(--bad)}
.mstate{display:none;margin-top:14px;align-self:flex-start}
.seg.state .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.status{display:flex;flex-direction:column;gap:9px;padding:0 4px 2px}
.status p{margin:0;font-size:13.5px;line-height:1.5;font-weight:500;text-wrap:pretty}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:600}
.meter .bar{flex:1;height:6px;border-radius:999px;background:rgba(20,32,43,.1);overflow:hidden}
.meter .fill{height:100%;border-radius:999px;transition:width .6s ease,background .3s}
.meter .word{font-weight:700;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.slidenav{display:none;align-items:center;gap:2px}
body.slides .slidenav{display:flex}
body.slides .sectors{display:none}
.slidenav span{font-size:12px;font-weight:700;color:var(--muted);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

/* right drawer */
.drawer{top:96px;bottom:max(var(--gut),env(safe-area-inset-bottom));right:max(var(--gut),env(safe-area-inset-right));width:min(384px,calc(100% - 32px));
  display:flex;flex-direction:column;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.drawer.closed{transform:translateX(calc(100% + 32px));opacity:0;pointer-events:none}
.dhead{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.dhead .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead h2{margin:12px 0 0;font-size:22px;line-height:1.2;letter-spacing:-.015em;font-weight:700;display:flex;gap:12px;align-items:center;text-wrap:balance}
.dhead h2 .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dtop{display:flex;gap:16px;align-items:center;margin-top:12px}
.dtop h2{margin:0}
.photo{width:84px;height:114px;object-fit:cover;border-radius:12px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media (max-width:760px){.photo{width:64px;height:87px}.dtop{gap:12px;margin-top:8px}}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--muted)}
.dbody{overflow:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:24px}
.sec h3{margin:0 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec p,.sec li{font-size:14.5px;line-height:1.7;margin:0}
.sec ul,.sec ol{margin:0;padding-left:18px;display:grid;gap:4px}
.sec mark{background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:5px;font-weight:600}
.sec.def{background:rgba(31,122,90,.07);border-radius:12px;padding:14px 16px}
.sec.def h3{color:var(--accent)}

/* hint + AR message */
.hint{top:96px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--muted);border-radius:999px;transition:opacity .6s;white-space:nowrap}
.hint.gone{opacity:0;pointer-events:none}

/* floating map labels */
.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;white-space:nowrap;background:var(--glass-strong);
  border-radius:8px;padding:4px 10px 4px 8px;box-shadow:0 2px 10px rgba(0,0,0,.16);display:flex;align-items:center;gap:6px}
.lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.lbl.b::before{background:var(--bad)}
.lbl.s::before{background:var(--blue)}
.lbl.y::before{background:var(--amber)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer}
.pin span{display:flex;gap:6px;align-items:center;background:rgba(20,32,43,.9);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px 6px 9px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.pin::after{content:"";width:2px;height:12px;background:rgba(20,32,43,.9)}
.pin:hover span{background:var(--accent)}
.pin:hover::after{background:var(--accent)}

/* quiz */
.modal{position:fixed;inset:0;background:rgba(15,25,35,.45);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.25);width:min(600px,100%);max-height:90vh;overflow:auto;padding:28px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.mhead h3{margin:0;font-size:20px;font-weight:700}
.qprog{font-weight:600;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.qtrack{height:4px;border-radius:999px;background:var(--tint);margin:8px 0 18px;overflow:hidden}
.qtrack div{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.qtext{font-weight:600;font-size:18px;line-height:1.45;margin:0 0 16px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{font-weight:500;font-size:14.5px;text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;line-height:1.45;display:flex;gap:12px}
.opt b{color:var(--muted)}
.opt:hover{border-color:rgba(20,32,43,.25)}
.opt.ok{background:#e6f4ee;border-color:var(--good)}
.opt.no{background:#fdecec;border-color:var(--bad)}
.fb{margin-top:14px;font-weight:600;min-height:1.4em}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.score{font-size:48px;font-weight:700;color:var(--accent);margin:4px 0 8px;letter-spacing:-.02em}
details{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:20px}
summary{font-weight:600;font-size:15px;cursor:pointer}
details ol{padding-left:20px;line-height:1.65;margin:12px 0 0}

@media (max-width:1100px){
  .ibtn .t{display:none}
  .ibtn{padding:0 10px}
}
@media (max-width:760px){
  :root{--gut:12px}
  .topbar{flex-direction:column;align-items:stretch;gap:8px}
  .brand{padding:7px 14px 7px 7px}
  .brand .mark{width:32px;height:32px}
  .brand h1{font-size:15px}
  .brand p{display:none}
  .toolbar{align-self:flex-end;overflow-x:auto;max-width:100%}
  .seg button{padding:6px 10px}
  .hint{top:128px;white-space:normal;text-align:center;width:calc(100% - 24px)}
  .leftcol{top:auto;left:var(--gut);right:var(--gut);width:auto;justify-content:flex-end;gap:8px}
  .sectors{width:auto;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;overflow:visible}
  .sectors .head{display:none}
  .sectors.min .list{display:flex}
  .list{flex-direction:row;overflow-x:auto;padding:2px;gap:6px;scrollbar-width:none}
  .list::-webkit-scrollbar{display:none}
  .item{width:auto;flex:none;padding:5px 12px 5px 5px;border-radius:999px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
  .item .ic{width:26px;height:26px;border-radius:999px}
  .item.cur{background:var(--ink)}
  .dock .row{flex-wrap:wrap}
  .seg.state button{font-size:12px}
  .drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:58vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .drawer.closed{transform:translateY(calc(100% + 24px))}
  .dhead{padding:16px 18px 12px}
  .dhead h2{font-size:19px;margin-top:8px}
  .dhead h2 .ic{width:36px;height:36px;font-size:18px}
  .dbody{padding:16px 18px 24px;gap:18px}
  .mbox{padding:20px}
  .mstate{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){.meter .fill,.drawer,.hint{transition:none}}
</style>
</head>
<body>

<div id="view">
  <canvas id="c"></canvas>
</div>
<div class="labels" id="labels"></div>

<header class="ui topbar">
  <div class="brand glass">
    <div class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l4-2v13M9 21V5l6-2v18M15 21v-9l4 2v7"/></svg></div>
    <div>
      <h1>Bandar Teknologi Hijau</h1>
      <p>Sains T4 · SP 4.1.3 · Sektor Teknologi Hijau</p>
    </div>
  </div>
  <div class="toolbar glass">
    <button class="ibtn primary" id="bquiz" title="Kuiz"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span class="t">Kuiz</span></button>
    <button class="ibtn on" id="blbl" title="Label pada peta"><svg class="i" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg><span class="t">Label</span></button>
    <button class="ibtn" id="bslide" title="Mod slaid"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="t">Slaid</span></button>
    <button class="ibtn" id="bfs" title="Skrin penuh"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<div class="ui hint glass" id="hint">Klik penanda sektor untuk maklumat · seret untuk pusing · skrol untuk zum</div>

<div class="ui leftcol">
  <nav class="sectors glass" id="sectors" aria-label="Sektor">
    <div class="head">
      <div><div class="eyebrow">SP 4.1.3</div><h2>Sektor Teknologi Hijau</h2></div>
      <button class="icon" id="bmin" aria-label="Kecilkan senarai"><svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
    </div>
    <div class="list" id="nav"></div>
  </nav>
  <section class="dock glass" aria-label="Status bandar">
    <div class="row">
      <div class="seg state" role="group" aria-label="Senario">
        <button id="t1" data-on="1"><span class="dot"></span>Dengan Teknologi Hijau</button>
        <button id="t0" data-on="0"><span class="dot"></span>Tanpa Teknologi Hijau</button>
      </div>
      <div class="slidenav">
        <button class="icon" id="prev" aria-label="Sebelum"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
        <span id="pos">Bandar</span>
        <button class="icon" id="next" aria-label="Seterusnya"><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="status">
      <p id="smsg"></p>
      <div class="meter"><span id="mname"></span><div class="bar"><div class="fill" id="mfill"></div></div><span class="word" id="mword"></span></div>
    </div>
  </section>
</div>

<aside class="ui drawer glass closed" id="drawer" aria-live="polite"></aside>

<div class="modal" id="quiz" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="qh">
    <div class="mhead"><h3 id="qh">Kuiz Sektor Teknologi Hijau</h3><button class="icon" id="qclose" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="qbody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=s=>document.getElementById(s);
const PI=Math.PI;
const lin=c=>new THREE.Color(c).convertSRGBToLinear();

/* ---------- three setup ---------- */
const view=$('view'),canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,200);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.minDistance=2.5;controls.maxDistance=36;controls.maxPolarAngle=PI*0.47;controls.enablePan=false;

const hemi=new THREE.HemisphereLight(lin(0xdce9f7),lin(0x6d6250),.75);scene.add(hemi);
const sunL=new THREE.DirectionalLight(lin(0xfff1de),2.1);sunL.position.set(10,16,7);sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048);
Object.assign(sunL.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:50});
sunL.shadow.bias=-.0005;sunL.shadow.normalBias=.02;scene.add(sunL);

/* ---------- procedural textures ---------- */
const ANISO=renderer.capabilities.getMaxAnisotropy();
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=ANISO;if(rep)t.repeat.set(rep,rep);return t;}
function speckle(c,w,h,base,amp,n){c.fillStyle=base;c.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){const v=(Math.random()-.5)*amp;c.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;c.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}}
const TEX={
  grass:canvasTex(256,256,(c,w,h)=>speckle(c,w,h,'#e4e4e4',.45,14000),5),
  asphalt:canvasTex(256,256,(c,w,h)=>speckle(c,w,h,'#55595e',.22,16000),10),
  paving:canvasTex(256,256,(c,w,h)=>{speckle(c,w,h,'#cdc8bf',.14,6000);c.strokeStyle='rgba(0,0,0,.10)';
    for(let i=0;i<=w;i+=32){c.beginPath();c.moveTo(i,0);c.lineTo(i,h);c.stroke();c.beginPath();c.moveTo(0,i);c.lineTo(w,i);c.stroke();}},8),
  metal:canvasTex(128,128,(c,w,h)=>{for(let i=0;i<w;i+=4){c.fillStyle=(i/4)%2?'#c6cacd':'#aeb3b8';c.fillRect(i,0,4,h);}},3),
  sky:(()=>{const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
    gr.addColorStop(0,'#5d8fc4');gr.addColorStop(.55,'#a9c6e0');gr.addColorStop(1,'#dfe8ee');g.fillStyle=gr;g.fillRect(0,0,4,256);
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;})()
};
function facadeTex(kind){return canvasTex(256,512,(c,w,h)=>{const cols=8,rows=16,cw=w/cols,rh=h/rows;
  const base={office:'#c2c5c8',glass:'#6f8ba3',apt:'#ddd2bf',brick:'#9b6250'}[kind];c.fillStyle=base;c.fillRect(0,0,w,h);
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){const x=k*cw,y=r*rh,lit=Math.random()<.1;
    const s=Math.floor(60+Math.random()*40);const glassCol=lit?'#f2e2b6':`rgb(${s-20},${s+5},${s+30})`;

function emitter(o){const P=cur;const parts=[];let acc=0;const geo=new THREE.SphereGeometry(1,8,6);const col=lin(o.color);

    while(acc>1&&parts.length<(o.max||30)){acc--;const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:o.op||.8,roughness:1,depthWrite:false}));
      const org=typeof o.origin==='function'?o.origin():o.origin;
      m.position.set(org[0]+(rnd()-.5)*o.spread,org[1],org[2]+(rnd()-.5)*o.spread);
      m.userData={age:0,v:[o.vel[0]+(rnd()-.5)*(o.jit||.2),o.vel[1]+(rnd()-.5)*(o.jit||.2),o.vel[2]+(rnd()-.5)*(o.jit||.2)]};
      m.scale.setScalar(o.size);P.add(m);parts.push(m);}
    if(acc>1)acc=1;
    for(let i=parts.length-1;i>=0;i--){const m=parts[i],u=m.userData;u.age+=dt;const k=u.age/o.life;
      if(o.toward){const tg=o.toward;m.position.lerp(new THREE.Vector3(tg[0],tg[1],tg[2]),dt*.6);}
      else m.position.set(m.position.x+u.v[0]*dt,m.position.y+u.v[1]*dt,m.position.z+u.v[2]*dt);
      m.scale.setScalar(o.size*(1+(o.grow||0)*k));m.material.opacity=(o.op||.8)*(1-k);
      if(k>=1){m.parent&&m.parent.remove(m);m.material.dispose();parts.splice(i,1);}}
  });}

 build(on){ground(on?0x69c35a:0xc2a77c);seed=3;
  const spots=[[-1.8,-1.4],[-.5,-2],[.9,-1.7],[2,-.6],[-2.3,.2],[-1.1,-.4],[.3,-.6],[1.6,.9]];
  if(on){spots.forEach(([x,z])=>tree(x,z,.8+rnd()*.4));
   for(let r=0;r<2;r++)for(let i=0;i<5;i++){const x=-1.8+i*.7,z=1.6+r*.6;box(.5,.08,.3,0x6d4c2f,x,.04,z);cone(.1,.25,0x8ce99a,x,.2,z,null,6);}

  else{spots.forEach(([x,z])=>cyl(.15,.18,.25,0x8b5a2b,x,.12,z,null,10));box(1.2,.3,.3,0x8b5a2b,1,.15,1.6).rotation.y=.6;
   emitter({origin:[0,.5,0],color:0x495057,rate:7,life:4,vel:[0,.55,0],spread:5,size:.12,op:.85});}

 build(on){ground(0x8fd16a);box(7,.02,1.6,0x495057,0,.01,.6);for(let i=-3;i<=3;i++)box(.5,.025,.08,0xffffff,i,.02,.6);
  const cars=[];
  if(on){const st=grp(-1.6,0,-1.3);box(.5,1.2,.4,0x40c057,0,.6,0,st);box(.3,.25,.05,0x212529,0,.9,.21,st);
   const cable=mesh(new THREE.TorusGeometry(.35,.03,6,16,PI),M(0x212529),.3,.5,.3,st);cable.rotation.y=PI/2;
   const ev=car(0xf8f9fa);ev.position.set(-.9,0,-1.2);panel(.4,-1.6,.3);turbine(1.8,-1.8,.8);
   const bus=grp(0,0,.6);box(2,.8,.7,0x2f9e44,0,.55,0,bus);box(1.8,.3,.72,M(0x74c0fc,{roughness:.1}),0,.7,0,bus);
   for(const x of[-.65,.65])for(const z of[.3,-.3]){const w=cyl(.16,.16,.1,0x212529,x,.16,z,bus,12);w.rotation.x=PI/2;}cars.push([bus,.6]);}
  else{for(const [z,c] of [[.3,0xc92a2a],[.95,0x1971c2]]){const k=car(c);k.position.z=z;cars.push([k,z]);
    emitter({origin:()=>{const b=new THREE.Vector3(-.6,.25,0).applyMatrix4(k.matrix);return[b.x,b.y,b.z];},color:0x343a40,rate:9,life:1.8,vel:[0,.45,0],spread:.05,size:.09,grow:3,op:.7});}
   box(.5,1,.4,0xe03131,-1.6,.5,-1.3);box(.3,.25,.05,0xffffff,-1.6,.75,-1.09);}
  ticks.push((t)=>cars.forEach(([k],i)=>{k.position.x=((t*.8+i*3)%7)-3.5;}));
  return on?[['🔌 Stesen pengecasan',-1.6,1.6,-1.3,'s'],['🚗 Kereta elektrik',-.9,1,-1.2],['🚌 Pengangkutan awam',0,1.5,.6,'y']]

  ticks.forEach(f=>f(t,dt));envTicks.forEach(f=>f(t,dt));
  if(tween){tween.k=Math.min(1,tween.k+dt/1.2);const e=tween.k<.5?2*tween.k*tween.k:1-Math.pow(-2*tween.k+2,2)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.k>=1)tween=null;}
  const w=wantOff();off[0]+=(w[0]-off[0])*Math.min(1,dt*6);off[1]+=(w[1]-off[1])*Math.min(1,dt*6);
  camera.setViewOffset(VW,VH,off[0],off[1],VW,VH);
  controls.update();renderer.render(scene,camera);
  if(showLabels){signs.forEach(l=>place(l,sel<0));detail.forEach(l=>place(l,l.k===sel));}}

document.addEventListener('keydown',e=>{if(!$('quiz').hidden){if(e.key==='Escape')$('quiz').hidden=true;return;}
  if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Escape')select(-1);});

/* ---------- quiz ---------- */
const Q=[
['Bangunan Berlian, ibu pejabat Suruhanjaya Tenaga, ialah contoh sektor…',['Bangunan','Pengangkutan','Tenaga','Perindustrian dan Pembuatan']],
['Sektor yang berfokus kepada pengawalan kadar gas karbon dioksida melalui penanaman pokok ialah…',['Pertanian dan Perhutanan','Teknologi Maklumat dan Komunikasi','Pengangkutan','Bangunan']],
['Mengolah sisa makanan menjadi baja kompos ialah usaha dalam sektor…',['Pengurusan Sisa dan Air Sisa','Tenaga','Perindustrian dan Pembuatan','Pengangkutan']],
['Program kecekapan tenaga untuk mengurangkan jerebu dan hujan asid ialah fokus sektor…',['Perindustrian dan Pembuatan','Pertanian dan Perhutanan','Bangunan','Teknologi Maklumat dan Komunikasi']],
['TMK hijau mengurangkan penggunaan bahan berbahaya dengan menggunakan bahan…',['terbiodegradasi','plastik tebal','logam berat','radioaktif']],
['Contoh tenaga boleh baharu dalam sektor tenaga ialah…',['hidroelektrik, solar dan angin','arang batu, petrol dan diesel','gas asli dan minyak','arang batu dan solar']],
['Stesen pengecasan kereta elektrik dan bas elektrik ialah contoh dalam sektor…',['Pengangkutan','Bangunan','Tenaga','Pengurusan Sisa dan Air Sisa']],
['Sektor Tenaga memfokuskan penggunaan…',['tenaga alternatif yang bersih dan bebas karbon','bahan api fosil yang lebih murah','arang batu untuk stesen janakuasa','petrol dan diesel']],
['Tadahan air hujan serta penggunaan tenaga dan air yang cekap ialah aspek yang ditekankan dalam sektor…',['Bangunan','Tenaga','Pengangkutan','Teknologi Maklumat dan Komunikasi']],
['Selain mengawal karbon dioksida, sektor Pertanian dan Perhutanan turut menekankan…',['penjagaan nutrien tanah','penggunaan kenderaan elektrik','pelupusan peralatan komputer','pembinaan bangunan hijau']],
['Berapakah bilangan sektor Teknologi Hijau?',['7','5','6','8']]
];
let qs=[],qi=0,score=0,answered=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function startQuiz(){qs=shuffle(Q).slice(0,10).map(([q,o])=>({q,a:o[0],o:shuffle(o)}));qi=0;score=0;showQ();}
function showQ(){answered=false;const x=qs[qi];
  $('qbody').innerHTML=`<div class="qprog">Soalan ${qi+1} daripada ${qs.length} · Markah ${score}</div><div class="qtrack"><div style="width:${qi/qs.length*100}%"></div></div>
  <p class="qtext">${x.q}</p>
  <div class="opts">${x.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${String.fromCharCode(65+i)}</b><span>${o}</span></button>`).join('')}</div>
  <div class="fb" id="fb"></div><div class="mfoot"><button class="ibtn primary" id="qnext" hidden>${qi<qs.length-1?'Seterusnya':'Lihat markah'}</button></div>`;
  $('qbody').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=x.o[+b.dataset.i]===x.a;
    if(ok){score++;b.classList.add('ok');$('fb').textContent='Betul! Syabas.';$('fb').style.color='var(--good)';}
    else{b.classList.add('no');$('qbody').querySelectorAll('.opt').forEach(o=>{if(x.o[+o.dataset.i]===x.a)o.classList.add('ok');});$('fb').textContent='Kurang tepat. Jawapan betul ditandakan hijau.';$('fb').style.color='var(--bad)';}
    $('qnext').hidden=false;$('qnext').focus();});
  $('qnext').onclick=()=>{qi++;qi<qs.length?showQ():endQ();};}
function endQ(){const pct=score/qs.length;
  $('qbody').innerHTML=`<div class="eyebrow">Markah anda</div><div class="score">${score} / ${qs.length}</div>
  <p style="font-size:16px;margin:0;font-weight:500">${pct>=.8?'Cemerlang! Anda menguasai sektor Teknologi Hijau.':pct>=.5?'Bagus! Ulang kaji sedikit lagi.':'Jangan putus asa, cuba lagi.'}</p>
  <details open><summary>Praktis Formatif 4.1 · Cadangan jawapan</summary><ol>
  <li><b>Nyatakan sektor-sektor yang terdapat dalam Teknologi Hijau.</b><br>Tenaga; Pertanian dan Perhutanan; Pengangkutan; Pengurusan Sisa dan Air Sisa; Bangunan; Perindustrian dan Pembuatan; Teknologi Maklumat dan Komunikasi (TMK).</li></ol></details>
  <div class="mfoot"><button class="ibtn primary" id="qagain">Cuba lagi</button></div>`;
  $('qagain').onclick=startQuiz;}
$('bquiz').onclick=()=>{$('quiz').hidden=false;startQuiz();};
$('qclose').onclick=()=>{$('quiz').hidden=true;};
$('quiz').onclick=e=>{if(e.target.id==='quiz')$('quiz').hidden=true;};

/* ---------- start ---------- */
resize();resetCam();buildEnv();buildCity();select(-1);tween=null;renderer.setAnimationLoop(loop);
})();
